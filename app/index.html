<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document Assistant</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <!-- Marked -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary: #9d4edd;
            --accent: #e0aaff;
            --glass-bg: rgba(20, 20, 25, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-soft: #b0b0b0;
            --msg-user: #240046;
            --msg-ai: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0a0a0f;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            overflow: hidden;
            position: relative;
        }

        /* Hide Scrollbar Completely */
        ::-webkit-scrollbar {
            display: none;
        }

        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Animated Background */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.4;
            animation: float 10s infinite ease-in-out;
        }

        .bg-orb-1 {
            width: 500px;
            height: 500px;
            background: #5a189a;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .bg-orb-2 {
            width: 400px;
            height: 400px;
            background: #3c096c;
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        .bg-orb-3 {
            width: 300px;
            height: 300px;
            background: #7b2cbf;
            top: 40%;
            left: 60%;
            animation-delay: -2s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(30px, 50px);
            }
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Glass Container */
        .app-container {
            width: 95%;
            /* Wider */
            max-width: 1100px;
            height: 90vh;
            /* Taller */
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #e0aaff, #9d4edd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .new-chat {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .new-chat:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;

        }

        /* Welcome Message */
        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        .welcome h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .welcome p {
            color: var(--text-soft);
            font-size: 1.1rem;
        }

        /* Messages */
        .message {
            display: flex;
            gap: 15px;
            max-width: 90%;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.ai {
            align-self: flex-start;
        }

        .bubble {
            padding: 15px 20px;
            border-radius: 18px;
            font-size: 1rem;
            line-height: 1.6;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .bubble:hover .copy-btn {
            opacity: 1;
        }

        .copy-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 6px;
            padding: 4px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .copy-btn:hover {
            background: var(--primary);
        }

        .copy-btn span {
            font-size: 16px;
        }

        .message.user .bubble {
            background: linear-gradient(135deg, #7b2cbf, #3c096c);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai .bubble {
            background: var(--msg-ai);
            color: white;
            /* Ensure text visible */
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 4px;
            padding-right: 35px;
            /* Space for copy button */
        }

        .avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.1);
        }

        .message.user .avatar {
            display: none;
        }

        /* Hide user avatar for cleaner look */

        /* Input Area (Floating) */
        .input-container {
            padding: 20px 30px 30px;
            position: relative;
        }

        .input-box {
            background: rgba(30, 30, 40, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: border 0.3s;
        }

        .input-box:focus-within {
            border-color: var(--primary);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 1rem;
            font-family: inherit;
            resize: none;
            max-height: 120px;
            padding: 10px 0;
        }

        textarea:focus {
            outline: none;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-soft);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .icon-btn.send {
            background: var(--primary);
            color: white;
        }

        .icon-btn.send:hover {
            background: #7b2cbf;
            transform: scale(1.05);
        }

        /* Loader */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 5px 0;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--text-soft);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        /* Markdown Styling */
        .markdown-body h1,
        .markdown-body h2 {
            color: var(--accent);
            margin-top: 15px;
        }

        .markdown-body strong {
            color: var(--accent);
        }

        .markdown-body hr {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            margin: 12px 0;
        }

        .markdown-body ul {
            margin-left: 10px;
            list-style: none;
            padding-left: 0;
        }

        .markdown-body ul li {
            padding: 6px 0;
            line-height: 1.5;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .markdown-body ul li:last-child {
            border-bottom: none;
        }

        .markdown-body code {
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 5px;
            border-radius: 4px;
            font-family: monospace;
        }

        .markdown-body pre {
            background: black;
            padding: 15px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 10px 0;
            border: 1px solid #333;
        }

        .markdown-body ol {
            margin-left: 20px;
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            height: 6px;
            margin: 8px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, var(--primary), var(--accent));
            height: 100%;
            border-radius: 8px;
            transition: width 0.3s ease;
        }

        .file-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(157, 78, 221, 0.2);
            border: 1px solid var(--primary);
            padding: 5px 12px;
            border-radius: 12px;
            color: var(--accent);
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

    <!-- Background Elements -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="brand">
                <span class="material-icons-round">auto_awesome</span>
                AI Assistant
            </div>
            <button class="new-chat" onclick="location.reload()">
                <span class="material-icons-round">refresh</span> Reset
            </button>
        </div>

        <!-- Chat Area -->
        <div class="chat-area" id="chat-history">
            <div class="welcome" id="welcome-screen">
                <h1>Unlock Your Documents</h1>
                <p>Upload a PDF/DOCX or just copy-paste the text</p>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-container">
            <div class="input-box">
                <button class="icon-btn" onclick="document.getElementById('file-upload').click()" title="Upload File">
                    <span class="material-icons-round">attach_file</span>
                </button>
                <input type="file" id="file-upload" accept=".pdf,.docx,.txt,.md" hidden>

                <textarea id="chat-input" placeholder="Ask anything..." rows="1" oninput="autoResize(this)"></textarea>

                <button class="icon-btn send" id="send-btn" onclick="handleSend()">
                    <span class="material-icons-round">arrow_upward</span>
                </button>
                <button class="icon-btn stop" id="stop-btn" onclick="stopGeneration()"
                    style="display: none; color: #ff4757;">
                    <span class="material-icons-round">stop</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Logic
        const chatInput = document.getElementById('chat-input');
        const fileInput = document.getElementById('file-upload');
        const history = document.getElementById('chat-history');

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 150) + 'px';
        }

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFileUpload(e.target.files[0]);
        });

        let controller = null; // AbortController

        function toggleState(isGenerating) {
            document.getElementById('send-btn').style.display = isGenerating ? 'none' : 'flex';
            document.getElementById('stop-btn').style.display = isGenerating ? 'flex' : 'none';
            if (isGenerating) {
                document.getElementById('welcome-screen').style.display = 'none';
            }
        }

        function stopGeneration() {
            if (controller) {
                controller.abort();
                controller = null;
                toggleState(false);
                appendMessage('ai', '<em>Generation stopped by user.</em>');
            }
        }

        async function handleSend() {
            const text = chatInput.value.trim();
            if (!text) return;

            toggleState(true);
            appendMessage('user', text);
            chatInput.value = '';
            autoResize(chatInput);

            const aiBubble = appendMessage('ai', '<div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>');

            controller = new AbortController();
            const signal = controller.signal;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text }),
                    signal: signal
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';
                aiBubble.innerHTML = ''; // Clear loader

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    fullText += decoder.decode(value);
                    aiBubble.innerHTML = marked.parse(fullText);
                    history.scrollTop = history.scrollHeight;
                }
            } catch (e) {
                if (e.name === 'AbortError') {
                    // Handled in stopGeneration
                } else {
                    aiBubble.innerText = "Error: " + e.message;
                }
            } finally {
                toggleState(false);
                controller = null;
            }
        }

        async function handleFileUpload(file) {
            fileInput.value = '';

            // File size check (25MB max)
            if (file.size > 25 * 1024 * 1024) {
                appendMessage('user', `<div class="file-tag"><span class="material-icons-round">description</span> ${file.name}</div>`);
                appendMessage('ai', '⚠️ File too large (max 25MB). Try a smaller document.');
                return;
            }

            toggleState(true);

            const userMsg = `<div class="file-tag"><span class="material-icons-round">description</span> ${file.name}</div> Summarize this document.`;
            appendMessage('user', userMsg);

            const aiBubble = appendMessage('ai', '📄 Reading document... <div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>');

            let form = new FormData();
            form.append("file", file);

            controller = new AbortController();
            const signal = controller.signal;

            try {
                let res = await fetch("/upload", { method: "POST", body: form, signal: signal });

                // Check for HTTP errors first
                if (!res.ok && !res.headers.get('content-type')?.includes('ndjson')) {
                    const errData = await res.json().catch(() => ({ error: 'Server error' }));
                    aiBubble.innerText = '❌ ' + (errData.error || `Server error (${res.status})`);
                    return;
                }

                const contentType = res.headers.get('content-type') || '';

                if (contentType.includes('application/x-ndjson')) {
                    // Streaming NDJSON — long document with progressive section rendering
                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';
                    let totalSections = 0;
                    let renderedSections = [];

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value, { stream: true });

                        const lines = buffer.split('\n');
                        buffer = lines.pop(); // keep incomplete line

                        for (const line of lines) {
                            if (!line.trim()) continue;
                            try {
                                const msg = JSON.parse(line);
                                if (msg.type === 'info') {
                                    totalSections = msg.total_sections;
                                    aiBubble.innerHTML = `<div style="color:var(--accent);margin-bottom:8px">📄 Analyzing <strong>${msg.word_count.toLocaleString()}</strong> words across <strong>${totalSections}</strong> sections...</div><div class="progress-bar"><div class="progress-fill" style="width:0%"></div></div>`;
                                } else if (msg.type === 'progress') {
                                    const pct = Math.round((msg.section / totalSections) * 100);
                                    const summary = msg.section_summary;
                                    if (summary && !summary.startsWith('(')) {
                                        const heading = msg.section_heading;
                                        const num = msg.section_number;
                                        const label = heading ? `**${num}. ${heading}:** ${summary}` : `**${num}.** ${summary}`;
                                        renderedSections.push(label);
                                    }

                                    // Build live markdown
                                    let liveMarkdown = `📄 **Analyzing...** (${msg.section}/${totalSections} sections)\n\n---\n\n`;
                                    liveMarkdown += renderedSections.join('\n\n');

                                    aiBubble.innerHTML = marked.parse(liveMarkdown);

                                    // Animate the last added section
                                    const allPs = aiBubble.querySelectorAll('p, strong');
                                    if (allPs.length > 0) {
                                        const last = allPs[allPs.length - 1];
                                        last.style.animation = 'fadeSlideIn 0.4s ease-out';
                                    }
                                } else if (msg.type === 'complete') {
                                    // Final: show overall summary + all sections
                                    aiBubble.innerHTML = marked.parse(msg.summary);
                                    aiBubble.style.animation = 'fadeSlideIn 0.5s ease-out';
                                } else if (msg.type === 'error') {
                                    aiBubble.innerText = '❌ ' + msg.message;
                                }
                            } catch (e) { /* skip bad JSON */ }
                        }
                        history.scrollTop = history.scrollHeight;
                    }

                    // If no complete message was received, show what we have
                    if (renderedSections.length > 0 && !aiBubble.innerHTML.includes('Key Points')) {
                        let fallback = '📄 **Partial Summary** (connection interrupted)\n\n---\n\n';
                        fallback += renderedSections.join('\n\n');
                        aiBubble.innerHTML = marked.parse(fallback);
                    }
                } else {
                    // Short document — direct JSON response
                    let data = await res.json();
                    if (res.ok) {
                        aiBubble.innerHTML = marked.parse(data.summary);
                    } else {
                        aiBubble.innerText = 'Error: ' + (data.error || 'Unknown');
                    }
                }
            } catch (e) {
                if (e.name === 'AbortError') {
                    // Handled in stopGeneration
                } else {
                    aiBubble.innerText = 'Network Error: ' + e.message;
                }
            } finally {
                toggleState(false);
                controller = null;
            }
            history.scrollTop = history.scrollHeight;
        }

        function appendMessage(role, content) {
            const div = document.createElement('div');
            div.className = `message ${role}`;

            let html = '';
            if (role === 'ai') {
                html = `
                    <div class="avatar"><span class="material-icons-round">smart_toy</span></div>
                    <div class="bubble markdown-body">
                        ${content}
                        <button class="copy-btn" onclick="copyText(this)" title="Copy">
                            <span class="material-icons-round">content_copy</span>
                        </button>
                    </div>
                `;
            } else {
                html = `<div class="bubble">${content}</div>`;
            }

            div.innerHTML = html;
            history.appendChild(div);
            history.scrollTop = history.scrollHeight;
            return div.querySelector('.bubble');
        }

        function copyText(btn) {
            const bubble = btn.parentElement;
            const text = bubble.innerText.replace('content_copy', '').replace('check', '').trim();
            navigator.clipboard.writeText(text).then(() => {
                const icon = btn.querySelector('span');
                icon.innerText = 'check';
                setTimeout(() => icon.innerText = 'content_copy', 2000);
            });
        }
    </script>
</body>

</html>
